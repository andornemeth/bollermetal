<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Disznóvágós ügyességi játék falusi udvaron, metálzenével és pálinkával.">
<style>html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Böllérmetál</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Pirata+One&display=swap">
<style>
/* Layout: one full-bleed canvas (the yard at dawn), a thin HUD strip on top, a gig-poster card over it between acts. */
:root{
  --soot:#15110f;      /* korom */
  --snow:#e8eef4;      /* hó */
  --blood:#c4161f;     /* vér */
  --lard:#f3e2b8;      /* zsír */
  --kekfesto:#1c3468;  /* kékfestő kötény */
  --ember:#f2a23a;     /* parázs, pálinka */
  --display:"Pirata One","UnifrakturCook","Old English Text MT",Georgia,serif;
  --ui:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--soot);color:var(--snow);font-family:var(--ui);font-size:18px;line-height:1.35;overflow:hidden}
[hidden]{display:none!important}
#game{position:relative;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;outline:none}

.hud{position:absolute;inset:0 0 auto 0;display:flex;align-items:center;gap:12px;
  padding-block:8px 18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(color-mix(in srgb,var(--soot) 88%,transparent),transparent);
  pointer-events:none;text-shadow:0 1px 2px var(--soot)}
.h-stage{font-family:var(--display);font-size:24px;color:var(--lard);white-space:nowrap}
.h-info{flex:1;min-width:0;text-align:center;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-mult{font-family:var(--display);font-size:22px;line-height:1;color:var(--soot);background:var(--ember);padding:2px 8px 4px;text-shadow:none;white-space:nowrap}
.h-score{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ember);white-space:nowrap}
#mute{pointer-events:auto;font:700 15px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--snow);
  background:color-mix(in srgb,var(--soot) 70%,transparent);border:1px solid var(--lard);padding:5px 10px;cursor:pointer;white-space:nowrap}
#mute:focus-visible,#go:focus-visible,#drink:focus-visible,.face:focus-visible{outline:3px solid var(--ember);outline-offset:3px}

/* pálinka: kupica a sarokban */
#drink{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;display:flex;align-items:center;gap:10px;
  font-family:var(--display);font-size:24px;line-height:1;color:var(--soot);background:var(--lard);
  border:2px solid var(--soot);box-shadow:5px 5px 0 var(--blood);padding:9px 14px 11px 12px;cursor:pointer;overflow:hidden;touch-action:manipulation}
#drink:active{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--blood)}
#drink .kup{width:16px;height:22px;flex:none;background:linear-gradient(transparent 28%,var(--ember) 28%);
  border:2px solid var(--soot);clip-path:polygon(0 0,100% 0,84% 100%,16% 100%)}
#drink b{font-family:var(--ui);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;background:var(--soot);color:var(--ember);padding:2px 7px}
#dBar{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--blood)}

.veil{position:absolute;inset:0;display:grid;place-items:center;overflow:auto;
  padding-block:56px 20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--soot) 52%,transparent)}
.veil.low{place-items:end center;background:transparent;pointer-events:none}
.veil.low .card{pointer-events:auto}
.card{width:100%;max-width:440px;background:var(--soot);border:2px solid var(--lard);box-shadow:8px 8px 0 var(--blood)}
/* kékfestő band: indigo cloth with white dot print */
.band{height:20px;background-color:var(--kekfesto);
  background-image:radial-gradient(circle,var(--snow) 1.6px,transparent 2px),radial-gradient(circle,var(--snow) 1px,transparent 1.4px);
  background-size:20px 20px,20px 20px;background-position:0 0,10px 10px;border-bottom:2px solid var(--lard)}
.card-body{display:flex;flex-direction:column;gap:10px;padding:18px 22px 22px}
.eyebrow{margin:0;font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember)}
.card h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(38px,9vw,54px);line-height:1;color:var(--lard);
  text-shadow:3px 3px 0 var(--blood);text-wrap:balance}
.card p{margin:0}
.result{font-weight:700;color:var(--ember)}
.pick{display:flex;gap:10px}
.face{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;cursor:pointer;
  background:transparent;border:2px solid var(--lard);color:var(--lard);font-family:var(--display);font-size:24px;line-height:1}
.face img{width:76px;height:76px;max-width:100%;border-radius:50%;object-fit:cover;border:2px solid var(--lard);background:var(--kekfesto)}
.face small{font-family:var(--ui);font-size:13px;line-height:1.1;color:var(--ember);font-variant-numeric:tabular-nums}
.face:hover,.face:active{background:var(--blood);color:var(--snow)}
.face:hover small,.face:active small{color:var(--lard)}
.tally{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr auto;gap:2px 16px;font-variant-numeric:tabular-nums}
.tally li{display:contents}
.tally b{font-weight:700;color:var(--lard);text-align:right}
.tally .rank span,.tally .rank b{padding-top:6px;font-family:var(--display);font-size:26px;color:var(--lard)}
#go{align-self:flex-start;margin-top:6px;font-family:var(--display);font-size:28px;line-height:1;color:var(--snow);background:var(--blood);
  border:2px solid var(--lard);padding:9px 26px 11px;cursor:pointer}
#go:hover{background:color-mix(in srgb,var(--blood) 80%,var(--ember))}
.hint{font-size:15px;opacity:.78}
@media (min-width:900px){.veil.low{place-items:end end}}
@media (max-width:520px){.h-stage,.h-unit{display:none}.h-info{text-align:left}.hud{gap:8px}#mute{font-size:13px;padding:4px 7px}.h-mult{font-size:19px;padding:2px 6px 3px}}
@media (max-height:480px){.card-body{padding:12px 18px 16px;gap:6px}.card h1{font-size:34px}.veil{padding-block:44px 10px}.face img{width:54px;height:54px}}
</style>

<div id="game">
  <canvas id="cv" tabindex="0" aria-label="Böllérmetál játéktér: havas falusi udvar hajnalban"></canvas>
  <div class="hud">
    <span class="h-stage" id="hStage">Böllérmetál</span>
    <span class="h-info" id="hInfo"></span>
    <span class="h-mult" id="hMult" hidden></span>
    <span class="h-score"><span id="hScore">0</span><span class="h-unit"> pont</span></span>
    <button id="mute" type="button" aria-pressed="false">Hang: be</button>
  </div>
  <button id="drink" type="button" hidden aria-label="Igyál egy kupica pálinkát"><span class="kup"></span><span>Pálinka</span><b id="dMult">×1</b><i id="dBar"></i></button>
  <div class="veil" id="veil">
    <section class="card" role="dialog" aria-labelledby="cTitle">
      <div class="band"></div>
      <div class="card-body">
        <p class="eyebrow" id="cEyebrow"></p>
        <h1 id="cTitle"></h1>
        <p class="result" id="cResult" hidden></p>
        <p id="cText"></p>
        <div class="pick" id="pick" hidden>
          <button class="face" type="button" data-i="0"><img alt="A fotó bal oldali embere"><span>Gazda</span><small></small></button>
          <button class="face" type="button" data-i="1"><img alt="A fotó középső embere"><span>Koma</span><small></small></button>
          <button class="face" type="button" data-i="2"><img alt="A fotó jobb oldali embere"><span>Sógor</span><small></small></button>
        </div>
        <ul class="tally" id="cTally" hidden></ul>
        <p class="hint" id="cHint" hidden></p>
        <button id="go" type="button"></button>
      </div>
    </section>
  </div>
</div>

  const out=c.createGain(); out.gain.value=.17;
  AU.gtr.connect(hp); hp.connect(ws); ws.connect(lp); lp.connect(mid); mid.connect(out); out.connect(AU.music);
  AU.lead = c.createGain(); AU.lead.gain.value=.16; AU.lead.connect(AU.music);
  const dl=c.createDelay(1); dl.delayTime.value=.2; const fb=c.createGain(); fb.gain.value=.3; const dgn=c.createGain(); dgn.gain.value=.45;
  AU.lead.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(dgn); dgn.connect(AU.music);
  const nb=c.createBuffer(1,c.sampleRate,c.sampleRate), d=nb.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; AU.noise=nb;

}
function schedule(){
  const c=AU.ctx; if(!c || c.state!=='running') return;
  if (AU.next < c.currentTime-.2) AU.next = c.currentTime+.05;
  while (AU.next < c.currentTime+.15) {
    const sec = SONG[AU.section];
    playStep(sec, AU.step, AU.next);
    AU.next += 60/sec.bpm/4; AU.step++;

}

  const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;

}

  e.gain.setValueAtTime(1,t+Math.max(.012,dur-.02)); e.gain.linearRampToValueAtTime(0,t+dur);

    const os=c.createOscillator(); os.type='sawtooth'; os.frequency.value=mf(m+o); os.detune.value=(i-1)*7;
    const og=c.createGain(); og.gain.value=chord?.42:.5; os.connect(og); og.connect(e); os.start(t); os.stop(t+dur+.03);
  });
}

  const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=300;

function leadNote(t,m,dur){

function kick(t){

const hat = (t,open) => noise(t,open?.2:.035,'highpass',8500,.5,open?.16:.13);
const crash = t => noise(t,1.1,'highpass',5200,.4,.3);
function playStep(sec,step,t){
  const sd=60/sec.bpm/4, bar=Math.floor(step/16)%sec.bars.length, s=step%16;
  if (s%4===0) { AU.beat0=t; AU.beatDur=sd*4; }
  const tok=sec.bars[bar][s];
  if (tok) {
    const m=40+tok.n;
    if (tok.k==='m') { gNote(t,m,sd*.55,false); bNote(t,m,sd*.6); }
    else if (tok.k==='c') { gNote(t,m,sd*tok.len*.94,true); bNote(t,m,sd*tok.len*.9); }
    else { gNote(t,m,sd*.92,true); if (s%2===0) bNote(t,m,sd*1.8); }
  }
  if (sec.lead) { const l=sec.lead[bar][s]; if (l) leadNote(t,l.m,sd*l.len*.96); }
  const d=sec.drums;
  if (d==='intro') { if (s%8===0) kick(t); if (s%4===0) hat(t); }
  else if (d==='dbl') { if (s===4||s===12) snare(t); kick(t); if (s%2===0) hat(t); if (bar===0&&s===0) crash(t); }
  else if (d==='blast') { if (s%2===0) kick(t); else snare(t); if (s%2===0) hat(t); if (bar%2===0&&s===0) crash(t); }
  else if (d==='half') { if (s===0||s===3||s===6||s===10||s===11) kick(t); if (s===8) snare(t); if (s%4===0) hat(t,true); if (bar===0&&s===0) crash(t); }
}

}
function photoBackdrop(){

  if(!force && PAL.cd>0) return;
  PAL.cd=1.1; PAL.total++; PAL.t=14;
  if(PAL.lvl<4){ PAL.lvl++; showFlash(PAL.lvl>=4?'Na, ez már sok lesz!':`Pálinka! ×${hu(mult())}`); } else showFlash('Tele vagy, komám!');

}

  },
  geom(){ return S3.geom(); },
  w(G,pt){ return { x:G.cx+pt[0]*G.k, y:G.cy+pt[1]*G.k }; },
  reset(){ this.cutting=false; this.prog=0; this.dev=0; this.devN=0; },
  update(dt){

    if(this.over) return;
    const left=this.D-this.t;

      const path=this.paths[this.i], R=Math.max(20,7*G.k), key=keys[' '];
      if(ptr.has){ this.seen=true; this.kn.x=ptr.x+wobX(16); this.kn.y=ptr.y-(ptr.type==='touch'?40:0)+wobY(16); }
      if(key){   // billentyűzet: a kés magától halad, közepes pontossággal

          while(this.prog<path.length-1){

            this.prog++; if(this.prog%2===0) puff(nx.x,nx.y,2,'#b3121d',70,500,.45,2.6);

      } else if(this.cutting) this.reset();

        const avg=this.devN?this.dev/this.devN:6, a=clamp(1-(avg-.8)/4.5,.15,1), mid=this.w(G,path[path.length>>1]);

      if(n===CUTS.length && left>0) addScore(left*8,G.cx,G.cy-36*G.k,avgMult());

    }
  },
  hud(){ return this.i<CUTS.length ? `Vágd: ${CUTS[this.i].name.toLowerCase()} · ${this.i}/${CUTS.length} · ${Math.max(0,Math.ceil(this.D-this.t))} mp` : ''; },
  tinted(){   // a megperzselt malac: a fotó aranybarnára színezve
    if(this.tc) return this.tc; const im=IMG.lie, c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight; const o=c.getContext('2d');

  line(G,pts,n){ g.beginPath(); const a=this.w(G,pts[0]); g.moveTo(a.x,a.y); for(let i=1;i<=n;i++){ const b=this.w(G,pts[i]); g.lineTo(b.x,b.y); } },
  draw(){

  grind:{eyebrow:'Ötödik felvonás', title:'Darálás ütemre', btn:'Tekerjük!',
    text:'A daráló a zene ütemére megy. Koppints (vagy szóköz) pontosan akkor, amikor a piros gyűrű ráér a körre. A sorozat egyre többet ér.'},
  stuff:{eyebrow:'Hatodik felvonás', title:'Hurkatöltés', btn:'Töltsük!',
    text:'Tartsd nyomva a töltéshez, és engedd el, amikor a hurka vége a két jel közé ér. Minél tovább nyomod, annál gyorsabban megy. Ha túlfut, kidurran. Sorozatban többet ér.'},
  tor:{eyebrow:'Este', title:'Disznótor', btn:'Még egy disznót!',
    text:'Kész a hurka, terítve az asztal. A malac odafentről rázza.'},
};
const veil=$('veil'), go=$('go'), drinkBtn=$('drink');
function showCard(key){
  mode='card'; cardKey=key; stage=key==='title'?'catch':key; cur=STG[stage]; cur.init();
  if(stage==='catch') S1.phase='idle';
  parts.length=0; floats.length=0; sizzle(0); clearDecals(); drinkBtn.hidden=true;
  const c=CARD[key];
  $('cEyebrow').textContent=c.eyebrow; $('cTitle').textContent=c.title; $('cText').textContent=c.text;
  go.hidden=key==='title'; go.textContent=c.btn||''; $('pick').hidden=key!=='title';
  const r=$('cResult'); r.hidden=!lastResult||key==='title'||key==='tor'; r.textContent=lastResult;
  const tops=HEROES.map((hh,i)=>`${hh.name} ${SC.best['h'+i]||'–'}`).join(' · ');
  const hintText=key==='tor'?'Csúcsok: '+tops:c.hint||'';
  const h=$('cHint'); h.textContent=hintText;
  h.hidden=!hintText;
  const tl=$('cTally'); tl.hidden=key!=='tor';
  if(key==='tor'){
    const rank=score<2200?'Kontár':score<3800?'Böllérinas':score<5600?'Böllér':'Főböllér';
    saveScore(pickId,score);
    const rows=[['Elkapás',res.catchT==null?'–':`${hu(res.catchT)} mp`],['Szúrás',res.stab==null?'–':res.stab>=1?'mesterszúrás':res.stab>=.6?'rendben':'kontármunka'],
      ['Felfogott vér',res.blood==null?'–':`${Math.round(res.blood*100)}%`],['Perzselés',res.singe==null?'–':`${Math.round(res.singe*100)}%`],['Bontás',res.cut==null?'–':`${Math.round(res.cut*100)}%`],['Darálás',res.grind==null?'–':`${Math.round(res.grind*100)}%`],
      ['Hurka',`${res.hurka} szál`],['Megivott pálinka',`${PAL.total} kupica`],['Összesen',`${score} pont`]];
    tl.textContent='';
    for(const [a,b] of rows){ const li=document.createElement('li'), s=document.createElement('span'), bb=document.createElement('b'); s.textContent=a; bb.textContent=b; li.append(s,bb); tl.append(li); }
    const li=document.createElement('li'); li.className='rank'; const s=document.createElement('span'), bb=document.createElement('b'); s.textContent='Rangod'; bb.textContent=rank; li.append(s,bb); tl.append(li);
    h.textContent=(SC.fresh?'Új csúcs! ':'')+'Csúcsok: '+HEROES.map((hh,i)=>`${hh.name} ${SC.best['h'+i]||'–'}`).join(' · ');
    setSection('chorus'); crowdCheer(); PAL.lvl=0;
  }
  $('hStage').textContent=key==='title'?'Böllérmetál':cur.name;
  veil.classList.toggle('low',key==='tor');
  if(key==='tor'){ veil.hidden=true; torT=4.5; showFlash('Egészségetekre!'); }
  else { veil.hidden=false; try{ (key==='title'?document.querySelector('.face[data-i="'+pickId+'"]'):go).focus({preventScroll:true}); }catch(e){} }
}
function finishStage(text){ mode='outro'; outroT=2.2; lastResult=text; drinkBtn.hidden=true; }
function resetRun(){ score=0; lastResult=''; gore=0; res={catchT:null,stab:null,blood:null,singe:null,burnt:0,cut:null,grind:null,hurka:0}; PAL.lvl=0; PAL.total=0; PAL.t=0; PAL.boost=0; }
document.querySelectorAll('.face').forEach(b=>{
  const i=+b.dataset.i; b.querySelector('img').src=HEROES[i].face;
  b.addEventListener('click',()=>{ initAudio(); resetRun(); setOrder(i); showCard('catch'); });
});
go.addEventListener('click',()=>{
  initAudio();
  if(cardKey==='tor'){ resetRun(); setSection('intro'); showCard('title'); return; }
  veil.hidden=true; mode='play'; pressEdge=false; ptr.down=false; multAcc=0; multTime=0; setSection(cur.music);
  if(stage==='catch') S1.phase='run';
  drinkBtn.hidden=false;
  try{ cv.focus({preventScroll:true}); }catch(e){}
});
drinkBtn.addEventListener('click',()=>drink(false));
$('mute').addEventListener('click',e=>{
  AU.on=!AU.on; initAudio();
  if(AU.master) AU.master.gain.setTargetAtTime(AU.on?.85:0,AU.ctx.currentTime,.03);
  e.currentTarget.textContent=AU.on?'Hang: be':'Hang: ki'; e.currentTarget.setAttribute('aria-pressed',String(!AU.on));
});

/* ---------- input ---------- */
function setPtr(e){ const r=cv.getBoundingClientRect(); ptr.x=W/2+((e.clientX-r.left)/S-W/2)/camZoom; ptr.y=H/2+((e.clientY-r.top)/S-H/2)/camZoom; ptr.type=e.pointerType||'mouse'; ptr.has=true; }
cv.addEventListener('pointerdown',e=>{ setPtr(e); ptr.down=true; pressEdge=true; try{cv.setPointerCapture(e.pointerId);}catch(_){} initAudio(); e.preventDefault(); });
cv.addEventListener('pointermove',setPtr);
const up=()=>{ ptr.down=false; };
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up); addEventListener('blur',()=>{ up(); for(const k in keys) keys[k]=false; });
cv.addEventListener('contextmenu',e=>e.preventDefault());
const keyName=e=>e.key.length===1?e.key.toLowerCase():e.key;
addEventListener('keydown',e=>{
  if(mode!=='play') return;
  const k=keyName(e);
  if((k===' '||k==='Enter') && !e.repeat){ pressEdge=true; }
  if(k==='p' && !e.repeat) drink(false);
  if(k===' '||k.startsWith('Arrow')) e.preventDefault();
  keys[k]=true;
});
addEventListener('keyup',e=>{ keys[keyName(e)]=false; });

/* ---------- resize ---------- */
function resize(){
  const r=cv.getBoundingClientRect(), vw=Math.max(200,r.width), vh=Math.max(200,r.height);
  DPR=Math.min(2,window.devicePixelRatio||1);
  S=clamp(Math.sqrt(vw*vh/(820*600)),.5,1.7); W=vw/S; H=vh/S;
  cv.width=Math.round(vw*DPR); cv.height=Math.round(vh*DPR); dc.width=cv.width; dc.height=cv.height;
  horizon=clamp(H*(photoBg()?.4:.36),150,300);
  buildBackdrop(); clearDecals(); makeCrowd();
  if(cur && cur.layout) cur.layout();
  if(!snow.length){ const n=reduced?24:110; for(let i=0;i<n;i++) snow.push({x:rnd(),y:rnd(),z:rnd(.4,1),ph:rnd(TAU)}); }
}
addEventListener('resize',resize);

/* ---------- loop ---------- */
const hudCache=['','','',''];
function setHud(){
  const info=mode==='card'?'':(cur.hud?cur.hud():''), sc=String(score), m=PAL.lvl>0&&mode!=='card'?`×${hu(mult())}`:'';
  if(info!==hudCache[0]){ $('hInfo').textContent=info; hudCache[0]=info; }
  if(sc!==hudCache[1]){ $('hScore').textContent=sc; hudCache[1]=sc; }
  if(m!==hudCache[2]){ const el=$('hMult'); el.hidden=!m; el.textContent=m; $('dMult').textContent=m||'×1'; hudCache[2]=m; }
  const bar=PAL.lvl>0?`${Math.round(clamp(PAL.t/14,0,1)*100)}%`:'0%';
  if(bar!==hudCache[3]){ $('dBar').style.width=bar; hudCache[3]=bar; }
}
function update(dt){
  const gdt=hitstop>0?0:dt; hitstop=Math.max(0,hitstop-dt);
  if(mode==='play'){
    multAcc+=mult()*gdt; multTime+=gdt;
    PAL.cd=Math.max(0,PAL.cd-dt); PAL.boost=Math.max(0,PAL.boost-dt);
    if(PAL.lvl>0){ PAL.t-=gdt; if(PAL.t<=0){ PAL.lvl--; PAL.t=14; } }
    if(gdt>0) cur.update(gdt);
  }
  else if(mode==='card'){
    if(cur.idle) cur.idle(dt);
    if(torT>0){ torT-=dt; if(torT<=0 && cardKey==='tor'){ veil.hidden=false; try{ go.focus({preventScroll:true}); }catch(e){} } }
  }
  else if(mode==='outro'){ outroT-=dt; if(outroT<=0) showCard(ORDER[ORDER.indexOf(stage)+1]); }
  PAL.sm=lerp(PAL.sm,mode==='card'?0:PAL.lvl,1-Math.exp(-dt*3));
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.t+=dt; if(p.t>=p.life){ parts.splice(i,1); continue; } p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
  for(let i=bubbles.length-1;i>=0;i--){ bubbles[i].t+=dt; if(bubbles[i].t>=bubbles[i].life) bubbles.splice(i,1); }
  for(let i=floats.length-1;i>=0;i--){ floats[i].t+=dt; if(floats[i].t>=1.4) floats.splice(i,1); }
  for(let i=lens.length-1;i>=0;i--){ lens[i].t+=dt; if(lens[i].t>=lens[i].life) lens.splice(i,1); }
  for(const c of crowd) c.cheer=Math.max(0,c.cheer-dt);
  for(const s of snow){ s.y+=(.03+.07*s.z)*dt; s.ph+=dt; if(s.y>1){ s.y=0; s.x=rnd(); } }
  if(Math.random()<dt*6) smoke.push({x:chim.x,y:chim.y,t:0,r:rnd(5,8),vx:rnd(6,16),life:3.4});
  if(Math.random()<dt*5) smoke.push({x:pot.x+rnd(-6,6),y:pot.y-26,t:0,r:rnd(3,5),vx:rnd(-4,8),steam:true,life:2.4});
  if(crowd.length && Math.random()<dt*3){ const c=pick(crowd); smoke.push({x:c.x+8,y:c.y-66*c.k,t:0,r:2,vx:rnd(4,10),steam:true,life:1.1}); }
  for(let i=smoke.length-1;i>=0;i--){ const s=smoke[i]; s.t+=dt; s.x+=s.vx*dt; s.y-=16*dt; if(s.t>s.life) smoke.splice(i,1); }
  if(flash){ flash.t+=dt; if(flash.t>1.3) flash=null; }
  shake=Math.max(0,shake-dt*30); punch=Math.max(0,punch-dt*.25);
  setHud();
}
function draw(){
  const b=Math.pow(1-beatPhase(),3), heavy=AU.section!=='intro', drunk=PAL.sm;
  const rot=reduced?0:Math.sin(tNow*.9)*.007*drunk;
  camZoom=1.016+punch+(reduced?0:.012*drunk+(heavy?.003*b:0));
  g.setTransform(1,0,0,1,0,0); g.fillStyle='#15110f'; g.fillRect(0,0,cv.width,cv.height);
  g.setTransform(S*DPR,0,0,S*DPR,0,0);
  g.translate(W/2,H/2); g.rotate(rot); g.scale(camZoom,camZoom);
  g.translate(-W/2+(reduced?0:rnd(-shake,shake)*.5+wobX(3)),-H/2+(reduced?0:rnd(-shake,shake)*.5));
  g.drawImage(bd,0,0,W,H); g.drawImage(dc,0,0,W,H);
  // reflektorok a tetőkről
  if(heavy && !reduced){
    g.save(); g.globalCompositeOperation='lighter';
    const beams=[[lights[0][0],lights[0][1],W*.5+Math.sin(tNow*.8)*W*.3,'255,60,50'],[lights[1][0],lights[1][1],W*.5+Math.sin(tNow*.63+2)*W*.34,'255,180,60']];
    for(const bm of beams){ const gr=g.createLinearGradient(bm[0],bm[1],bm[2],H); gr.addColorStop(0,`rgba(${bm[3]},${.16+.1*b})`); gr.addColorStop(1,`rgba(${bm[3]},0)`);
      g.fillStyle=gr; g.beginPath(); g.moveTo(bm[0],bm[1]); g.lineTo(bm[2]-W*.11,H); g.lineTo(bm[2]+W*.11,H); g.closePath(); g.fill(); }
    g.restore();
  }
  for(const s of smoke){ g.globalAlpha=(1-s.t/s.life)*(s.steam?.34:.5); ell(s.x,s.y,s.r+s.t*5,s.r+s.t*5,s.steam?'#ffffff':'#8a86a0'); }
  g.globalAlpha=1;
  // üst a katlanon, parázsfénnyel
  g.save(); g.globalCompositeOperation='lighter'; { const gr=g.createRadialGradient(pot.x,pot.y,2,pot.x,pot.y,60); gr.addColorStop(0,'rgba(255,150,50,.34)'); gr.addColorStop(1,'rgba(255,150,50,0)'); g.fillStyle=gr; g.beginPath(); g.ellipse(pot.x,pot.y+2,60,18,0,0,TAU); g.fill(); } g.restore();
  const fl=4+Math.sin(tNow*17)*2;
  tri(pot.x-11,pot.y,pot.x-2,pot.y-13-fl,pot.x+4,pot.y,'#f2a23a'); tri(pot.x-3,pot.y,pot.x+5,pot.y-10-fl*.7,pot.x+11,pot.y,'#ff7a2a'); tri(pot.x-5,pot.y,pot.x,pot.y-7-fl*.6,pot.x+5,pot.y,'#ffe08a');
  g.beginPath(); g.roundRect(pot.x-16,pot.y-26,32,18,[3,3,9,9]); g.fillStyle='#1d181c'; g.fill(); outline(1.6); rr(pot.x-18,pot.y-28,36,4,2,'#2b252b');
  g.strokeStyle='#2b252b'; g.lineWidth=2.4; seg(pot.x-12,pot.y-9,pot.x-15,pot.y+1); seg(pot.x+12,pot.y-9,pot.x+15,pot.y+1);
  drawBand(b);
  // a falu népe
  for(const c of crowd){
    const ch=c.cheer>0;
    drawPerson(c.x,c.y-(ch?Math.abs(Math.sin(tNow*14+c.ph*9))*5:0),{...c,bang:b*(.5+c.ph*.6),aL:ch?2.7:.22,aR:ch?2.7:(c.glass?1.9:.22),open:ch,horns:ch});
  }
  cur.draw();
  for(const p of parts){ if(p.glow) g.globalCompositeOperation='lighter'; g.globalAlpha=1-p.t/p.life; ell(p.x,p.y,p.r,p.r,p.col); if(p.glow) g.globalCompositeOperation='source-over'; }
  g.globalAlpha=1; g.fillStyle='#fff';
  for(const s of snow){ const x=(s.x+Math.sin(s.ph)*.012)*W; g.globalAlpha=.45+.5*s.z; g.beginPath(); g.arc(x,s.y*H,.8+2.2*s.z,0,TAU); g.fill(); }
  g.globalAlpha=1;
  // szövegbuborékok
  g.font='700 15px "Barlow Condensed","Arial Narrow",sans-serif'; g.textBaseline='middle'; g.textAlign='left';
  for(const bb of bubbles){
    const a=Math.min(1,bb.t*6,(bb.life-bb.t)*4), w=g.measureText(bb.text).width+18, x=clamp(bb.x-w/2,6,W-w-6), y=Math.max(50,bb.y-24), tx=clamp(bb.x,x+10,x+w-10);
    g.globalAlpha=a; g.beginPath(); g.roundRect(x,y,w,25,8); g.fillStyle='#f3e2b8'; g.fill(); outline(1.6); tri(tx-5,y+24,tx+5,y+24,tx,y+32,'#f3e2b8');
    g.fillStyle='#15110f'; g.fillText(bb.text,x+9,y+13);
  }
  g.globalAlpha=1; g.textAlign='center';
  for(const f of floats){ const a=Math.min(1,(1.4-f.t)*2.5), y=f.y-f.t*46; g.globalAlpha=a; g.font='700 22px "Barlow Condensed","Arial Narrow",sans-serif'; g.lineWidth=4; g.strokeStyle='#15110f'; g.lineJoin='round'; g.strokeText(f.text,f.x,y); g.fillStyle=f.col; g.fillText(f.text,f.x,y); }
  g.globalAlpha=1;
  // utómunka: kettős látás, vignetta, vér a lencsén, felirat
  if(drunk>1.6 && !reduced){ g.setTransform(1,0,0,1,0,0); g.globalAlpha=Math.min(.3,.14*(drunk-1.4)); g.drawImage(cv,Math.sin(tNow*2.2)*5*DPR*(drunk-1),Math.cos(tNow*1.6)*2*DPR); g.globalAlpha=1; }
  g.setTransform(1,0,0,1,0,0); g.drawImage(vg,0,0);
  if(!reduced){ if(!grainPat) grainPat=g.createPattern(grainC,'repeat'); const ox=(Math.random()*128)|0, oy=(Math.random()*128)|0; g.translate(-ox,-oy); g.fillStyle=grainPat; g.fillRect(ox,oy,cv.width,cv.height); }
  g.setTransform(S*DPR,0,0,S*DPR,0,0);
  for(const l of lens){ const a=Math.min(1,(l.life-l.t)*.8)*.75, x=l.x*W, y=l.y*H+l.t*6, lr=rng(Math.floor(l.s*1000)); g.globalAlpha=a;
    for(let i=0;i<7;i++){ const an=lr()*TAU, d=lr()*l.r; ell(x+Math.cos(an)*d,y+Math.sin(an)*d*.8,l.r*(.25+lr()*.4),l.r*(.22+lr()*.34),i%3?'#a00f1a':'#7a0a12'); }
    g.fillStyle='#a00f1a'; g.fillRect(x-2,y,4,l.r*.8+l.t*14); ell(x,y+l.r*.8+l.t*14,3.4,4.4,'#a00f1a'); ell(x-l.r*.2,y-l.r*.2,l.r*.14,l.r*.08,'rgba(255,180,180,.5)'); }
  g.globalAlpha=1;
  if(flash){
    const sc=1+Math.max(0,.25-flash.t)*2, a=Math.min(1,(1.3-flash.t)*3), fs=Math.min(56,W*.11);
    g.save(); g.translate(W/2,Math.max(100,horizon*.62)); g.scale(sc,sc); g.rotate(-.03); g.globalAlpha=a;
    g.font=`${fs}px "Pirata One",Georgia,serif`; g.textAlign='center'; g.textBaseline='middle'; g.lineJoin='round';
    g.lineWidth=7; g.strokeStyle='#15110f'; g.strokeText(flash.text,0,0);
    g.fillStyle='#c4161f'; g.fillText(flash.text,3,3); g.fillStyle='#f3e2b8'; g.fillText(flash.text,0,0); g.restore();
  }
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000)); last=now; tNow+=dt;
  update(dt); draw(); pressEdge=false;
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
function start(data){
  if(data && typeof data.pick==='number') setOrder(clamp(data.pick|0,0,2));
  resize(); booted=true; showBests();
  if(data && data.stage && ORDER.includes(data.stage)){ score=data.score||0; if(data.res) res=data.res; gore=data.gore||0; showCard(data.stage); }
  else showCard('title');
  if(document.fonts && document.fonts.load){ document.fonts.load('700 15px "Barlow Condensed"'); document.fonts.load('40px "Pirata One"'); }
  requestAnimationFrame(t=>{ last=t; frame(t); });
}
const hot=window.claude && window.claude.hot;
if(hot && hot.snapshot) hot.snapshot(()=>({stage:cardKey==='title'?null:stage,score,res,gore,pick:pickId}));
if(hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
window.__bm={ cut:()=>{ const G=S6.geom(), pts=S6.paths[Math.min(S6.i,CUTS.length-1)]; return { i:S6.i, over:S6.over, pts:pts.map(q=>[(W/2+(G.cx+q[0]*G.k-W/2)*camZoom)*S,(H/2+(G.cy+q[1]*G.k-H/2)*camZoom)*S]) }; }, beat:()=>({p:beatPhase(),hits:S7.hits,beat:S7.beat,over:S7.over}), pig:()=>({x:(W/2+(S1.pig.x+S1.pig.dir*24-W/2)*camZoom)*S,y:(H/2+(S1.pig.y-H/2)*camZoom)*S,phase:S1.phase,t:S1.t}), go:k=>showCard(k), drink:()=>drink(true), state:()=>({stage,mode,score,pal:PAL.lvl}) };
})();
</script>
